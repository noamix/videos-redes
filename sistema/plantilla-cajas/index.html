<!doctype html>
<html
  lang="es"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"etiqueta","type":"string","label":"Etiqueta de la línea","default":"Producto destacado"},
    {"id":"p1","type":"string","label":"Pantalla 1: gancho","default":"Mirá lo nuevo de la tienda"},
    {"id":"p2_titulo","type":"string","label":"Pantalla 2: título","default":"Producto 30 x 40"},
    {"id":"p2_punto_1","type":"string","label":"Pantalla 2: punto 1","default":"Pack de 100 unidades"},
    {"id":"p2_punto_2","type":"string","label":"Pantalla 2: punto 2","default":"Calidad de fábrica"},
    {"id":"p2_punto_3","type":"string","label":"Pantalla 2: punto 3","default":"Ideal para tu negocio"},
    {"id":"p3_titulo","type":"string","label":"Pantalla 3: cierre","default":"Hacé tu pedido hoy"},
    {"id":"p3_sub","type":"string","label":"Pantalla 3: bajada","default":"Todo el catálogo en la web"},
    {"id":"web","type":"string","label":"Web","default":"tumarca.com.ar"},
    {"id":"marca","type":"string","label":"Marca","default":"TU MARCA"},
    {"id":"usar_logo","type":"boolean","label":"Usar logo en el cierre","default":false},
    {"id":"foto_1_ar","type":"number","label":"Proporción foto 1 (ancho/alto)","default":1,"min":0.3,"max":3,"step":0.01},
    {"id":"foto_2_ar","type":"number","label":"Proporción foto 2 (ancho/alto)","default":1,"min":0.3,"max":3,"step":0.01},
    {"id":"foto_3_ar","type":"number","label":"Proporción foto 3 (ancho/alto)","default":1,"min":0.3,"max":3,"step":0.01},
    {"id":"precio","type":"string","label":"Precio (vacío = sin precio)","default":""},
    {"id":"precio_valor","type":"number","label":"Precio en número (para la cuenta)","default":0,"min":0,"max":100000000,"step":0.01},
    {"id":"precio_unidad","type":"string","label":"Precio por unidad","default":""},
    {"id":"precio_mes","type":"string","label":"Mes del precio","default":""},
    {"id":"whatsapp","type":"string","label":"WhatsApp (vacío = botón de la web)","default":""},
    {"id":"beneficios","type":"string","label":"Beneficios fijos, separados por |","default":""},
    {"id":"amarillo","type":"color","label":"Color principal (el de las pantallas claras)","default":"#F7CE00"},
    {"id":"negro","type":"color","label":"Color oscuro (el de la pantalla del medio)","default":"#0B0B0B"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Estilo "cajas": pantallas del color principal y del oscuro (amarillo y negro si no se eligen otros), títulos de dos tonos con caja, barridos en diagonal. -->
    <!-- GSAP local: el render no depende de internet -->
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --amarillo: #f7ce00;
        --negro: #0b0b0b;
        --blanco: #ffffff;
        --fuente: "Inter", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--amarillo);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: var(--fuente);
        background: var(--amarillo);
      }
      .capa {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      /* ---------- Fondos ---------- */
      .fondo-amarillo {
        position: absolute;
        inset: 0;
        background: var(--amarillo);
      }
      .rayas {
        position: absolute;
        left: -400px;
        top: -300px;
        width: 1900px;
        height: 2600px;
        background: repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0 26px, transparent 26px 62px);
      }
      .fondo-negro {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 85% 60% at 50% 55%, #242424 0%, #101010 52%, #050505 100%);
      }
      .brillo {
        position: absolute;
        width: 980px;
        height: 460px;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, color-mix(in srgb, var(--amarillo) 42%, transparent) 0%, transparent 70%);
      }

      /* ---------- Piezas comunes ---------- */
      .marca {
        position: absolute;
        left: 80px;
        top: 200px;
        height: 54px;
        padding: 0 24px;
        border-radius: 27px;
        font: 900 24px/54px var(--fuente);
        letter-spacing: 0.22em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .sobre-amarillo .marca {
        background: var(--negro);
        color: var(--blanco);
      }
      .sobre-negro .marca {
        background: var(--amarillo);
        color: var(--negro);
      }

      /* Título de dos tonos: la primera parte suelta y la segunda en una caja inclinada */
      .duo {
        position: absolute;
        left: 60px;
        width: 960px;
        text-align: center;
        font-weight: 900;
        line-height: 0.98;
        letter-spacing: -0.045em;
      }
      .duo-a {
        display: block;
        text-wrap: balance;
      }
      .duo-b {
        display: inline-block;
        max-width: 100%;
        margin-top: 0.08em;
        padding: 0.04em 0.2em 0.1em;
        border-radius: 0.12em;
        text-wrap: balance;
      }
      .sobre-amarillo .duo-a {
        color: var(--negro);
      }
      .sobre-amarillo .duo-b {
        background: var(--negro);
        color: var(--amarillo);
      }
      .sobre-negro .duo-a {
        color: var(--blanco);
      }
      .sobre-negro .duo-b {
        background: var(--amarillo);
        color: var(--negro);
      }

      .flota {
        position: absolute;
      }
      .tarjeta {
        position: absolute;
        inset: 0;
        background: #ffffff;
        border-radius: 44px;
        overflow: hidden;
        box-shadow: 0 40px 70px rgba(0, 0, 0, 0.28), 0 10px 20px rgba(0, 0, 0, 0.16);
      }
      .sobre-negro .tarjeta {
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.65);
      }
      .foto {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        padding: 22px;
      }

      /* ---------- Pantalla 1 ---------- */
      #e1-etiqueta {
        position: absolute;
        height: 62px;
        padding: 0 28px;
        border: 4px solid var(--negro);
        border-radius: 31px;
        color: var(--negro);
        font: 800 28px/54px var(--fuente);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      /* ---------- Pantalla 2 ---------- */
      #e2-lista {
        position: absolute;
        list-style: none;
      }
      .punto {
        height: 76px;
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .tilde {
        flex: 0 0 auto;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: var(--amarillo);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .tilde svg {
        width: 32px;
        height: 32px;
        color: var(--negro);
      }
      .punto-txt {
        font: 800 46px/1.1 var(--fuente);
        letter-spacing: -0.015em;
        color: var(--blanco);
        white-space: nowrap;
      }
      #e2-insignia {
        position: absolute;
        width: 156px;
        height: 156px;
        border-radius: 50%;
        background: var(--amarillo);
        box-shadow: 0 16px 34px rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #e2-insignia svg {
        width: 84px;
        height: 84px;
        color: var(--negro);
      }

      /* Precio (pantalla 2, solo si mostrar_precio = SI) */
      #e2-precio {
        position: absolute;
        left: 60px;
        width: 960px;
        text-align: center;
        display: none;
      }
      #e2-precio-num {
        display: block;
        font-weight: 900;
        line-height: 0.95;
        letter-spacing: -0.05em;
        color: var(--amarillo);
        white-space: nowrap;
      }
      #e2-precio-unidad {
        display: inline-block;
        margin-top: 18px;
        padding: 6px 22px 10px;
        border-radius: 10px;
        background: var(--amarillo);
        color: var(--negro);
        font: 900 42px/1.1 var(--fuente);
        letter-spacing: -0.02em;
        white-space: nowrap;
      }
      #e2-precio-mes {
        display: block;
        margin-top: 16px;
        font: 600 28px/1.2 var(--fuente);
        color: #9a9a9a;
        white-space: nowrap;
      }

      /* ---------- Pantalla 3 ---------- */
      #e3-benef {
        position: absolute;
        list-style: none;
      }
      .benef {
        height: 66px;
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .benef-ic {
        flex: 0 0 auto;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--negro);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .benef-ic svg {
        width: 30px;
        height: 30px;
        color: var(--amarillo);
      }
      .benef-txt {
        font: 800 40px/1.1 var(--fuente);
        letter-spacing: -0.015em;
        color: var(--negro);
        white-space: nowrap;
      }
      #e3-wa {
        position: absolute;
        height: 116px;
        padding: 0 54px 0 46px;
        border-radius: 58px;
        background: #22c55e;
        color: #ffffff;
        display: none;
        align-items: center;
        gap: 20px;
        box-shadow: 0 10px 0 #15803d, 0 26px 44px rgba(0, 0, 0, 0.25);
      }
      #e3-wa svg {
        width: 54px;
        height: 54px;
        display: block;
      }
      #e3-wa-num {
        font: 900 56px/116px var(--fuente);
        letter-spacing: -0.01em;
        word-spacing: 0.14em;
        white-space: nowrap;
      }
      #e3-wa-web {
        position: absolute;
        left: 60px;
        width: 960px;
        text-align: center;
        font: 800 38px/1.2 var(--fuente);
        letter-spacing: -0.01em;
        color: var(--negro);
        white-space: nowrap;
        display: none;
      }
      #e3-logo {
        position: absolute;
        height: 90px;
        width: auto;
        display: none;
      }
      #e3-sub {
        position: absolute;
        left: 60px;
        width: 960px;
        text-align: center;
        font: 800 44px/1.15 var(--fuente);
        letter-spacing: -0.015em;
        color: var(--negro);
        white-space: nowrap;
      }
      #e3-boton {
        position: absolute;
        height: 116px;
        padding: 0 52px;
        border-radius: 58px;
        background: var(--negro);
        color: var(--amarillo);
        display: flex;
        align-items: center;
        gap: 22px;
        box-shadow: 0 10px 0 rgba(0, 0, 0, 0.3), 0 26px 44px rgba(0, 0, 0, 0.28);
      }
      #e3-web {
        font: 900 50px/116px var(--fuente);
        letter-spacing: -0.025em;
        white-space: nowrap;
      }
      #e3-flecha {
        width: 50px;
        height: 50px;
        display: block;
      }

      /* ---------- Barridos en diagonal entre pantallas ---------- */
      .barrido {
        z-index: 60;
        overflow: hidden;
      }
      .banda {
        position: absolute;
        left: 0;
        top: -200px;
        width: 2000px;
        height: 2320px;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <!-- Pantalla 1: gancho (armada desde el cuadro 0, que es la miniatura) -->
      <div id="e1" class="clip capa sobre-amarillo" data-start="0" data-duration="5" data-track-index="1" style="z-index: 10" data-layout-allow-overflow>
        <div class="fondo-amarillo"><div id="e1-rayas" class="rayas"></div></div>
        <div class="marca"><span id="e1-marca" data-var-text="marca">TU MARCA</span></div>
        <h1 id="e1-titulo" class="duo"><span id="e1-a" class="duo-a"></span><span id="e1-b" class="duo-b"></span></h1>
        <div id="e1-etiqueta"><span id="e1-etiqueta-txt" data-var-text="etiqueta">Producto destacado</span></div>
        <div id="e1-flota" class="flota">
          <div class="tarjeta" data-layout-allow-overflow><img id="e1-foto" class="foto" src="assets/fotos/foto_1.jpg" alt="" /></div>
        </div>
      </div>

      <!-- Pantalla 2: detalle, en negro -->
      <div id="e2" class="clip capa sobre-negro" data-start="5" data-duration="5" data-track-index="2" style="z-index: 10" data-layout-allow-overflow>
        <div class="fondo-negro"></div>
        <div id="e2-brillo" class="brillo"></div>
        <div class="marca"><span id="e2-marca" data-var-text="marca">TU MARCA</span></div>
        <h2 id="e2-titulo" class="duo"><span id="e2-a" class="duo-a"></span><span id="e2-b" class="duo-b"></span></h2>
        <div id="e2-precio"><span id="e2-precio-num"></span><span id="e2-precio-unidad"></span><span id="e2-precio-mes"></span></div>
        <ul id="e2-lista">
          <li id="e2-p1" class="punto"><span id="e2-t1" class="tilde"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg></span><span id="e2-x1" class="punto-txt" data-var-text="p2_punto_1">Pack de 100 unidades</span></li>
          <li id="e2-p2" class="punto"><span id="e2-t2" class="tilde"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg></span><span id="e2-x2" class="punto-txt" data-var-text="p2_punto_2">Calidad de fábrica</span></li>
          <li id="e2-p3" class="punto"><span id="e2-t3" class="tilde"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg></span><span id="e2-x3" class="punto-txt" data-var-text="p2_punto_3">Ideal para tu negocio</span></li>
        </ul>
        <div id="e2-flota" class="flota">
          <div class="tarjeta" data-layout-allow-overflow><img id="e2-foto" class="foto" src="assets/fotos/foto_2.jpg" alt="" /></div>
        </div>
        <div id="e2-insignia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg></div>
      </div>

      <!-- Pantalla 3: cierre -->
      <div id="e3" class="clip capa sobre-amarillo" data-start="10" data-duration="5" data-track-index="3" style="z-index: 10" data-layout-allow-overflow>
        <div class="fondo-amarillo"><div id="e3-rayas" class="rayas"></div></div>
        <div class="marca"><span id="e3-marca" data-var-text="marca">TU MARCA</span></div>
        <ul id="e3-benef"></ul>
        <div id="e3-flota" class="flota">
          <div class="tarjeta" data-layout-allow-overflow><img id="e3-foto" class="foto" src="assets/fotos/foto_3.jpg" alt="" /></div>
        </div>
        <img id="e3-logo" src="assets/marca/logo.png" alt="" />
        <h2 id="e3-titulo" class="duo"><span id="e3-a" class="duo-a"></span><span id="e3-b" class="duo-b"></span></h2>
        <div id="e3-sub" data-var-text="p3_sub">Todo el catálogo en la web</div>
        <div id="e3-boton">
          <span id="e3-web" data-var-text="web">tumarca.com.ar</span>
          <svg id="e3-flecha" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 5l7 7-7 7" /></svg>
        </div>
        <div id="e3-wa">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" /></svg>
          <span id="e3-wa-num"></span>
        </div>
        <div id="e3-wa-web"></div>
      </div>

      <!-- Barridos: la banda tiene el color de la pantalla que se va y destapa la nueva en diagonal -->
      <div id="c1" class="clip capa barrido" data-start="4.5" data-duration="1.05" data-track-index="5">
        <div id="c1-banda" class="banda" style="background: var(--amarillo)"></div>
      </div>
      <div id="c2" class="clip capa barrido" data-start="9.5" data-duration="1.05" data-track-index="5">
        <div id="c2-banda" class="banda" style="background: var(--negro)"></div>
      </div>
    </div>

    <script>
      (function () {
        // ---- Variables del video (las define el motor en cada render) ----
        var declaradas = JSON.parse(document.documentElement.getAttribute("data-composition-variables") || "[]");
        var V = {};
        declaradas.forEach(function (d) { V[d.id] = d["default"]; });
        try {
          var H = window.__hyperframes;
          if (H && typeof H.getVariables === "function") {
            var resueltas = H.getVariables() || {};
            Object.keys(resueltas).forEach(function (k) { V[k] = resueltas[k]; });
          }
        } catch (e) {}

        function $(id) { return document.getElementById(id); }
        function lleno(x) { return x != null && String(x).trim() !== ""; }
        if (V.amarillo) document.documentElement.style.setProperty("--amarillo", V.amarillo);
        if (V.negro) document.documentElement.style.setProperty("--negro", V.negro);

        // Pone el texto. Las palabras con guion ("e-commerce") y las medidas ("30 x 40 cm") van enteras: nunca se cortan.
        function texto(id, valor) {
          var el = typeof id === "string" ? $(id) : id;
          if (!el) return el;
          var s = valor == null ? "" : String(valor);
          el.textContent = "";
          s.split(/(\S*\S-\S\S*|\d+(?:\s*[x×]\s*\d+)+(?:\s*cm\b)?)/i).forEach(function (parte, i) {
            if (!parte) return;
            if (i % 2 === 1) {
              var sp = document.createElement("span");
              sp.style.whiteSpace = "nowrap";
              sp.textContent = parte;
              el.appendChild(sp);
            } else {
              el.appendChild(document.createTextNode(parte));
            }
          });
          return el;
        }

        // Parte un título en dos: la primera parte va suelta y la segunda en la caja.
        // Busca que la caja quede con casi la mitad del texto y que la primera parte no termine en "de", "con", "tu"…
        var COLGANTES = ["de", "del", "con", "para", "por", "y", "e", "o", "a", "al", "en", "el", "la", "los", "las", "tu", "tus", "sin", "su", "sus", "que"];
        function partir(t) {
          t = String(t || "").replace(/\s+/g, " ").trim();
          if (!t) return ["", ""];
          var coma = t.lastIndexOf(", ");
          if (coma > 0 && coma < t.length - 3) return [t.slice(0, coma + 1), t.slice(coma + 2)];
          var fichas = t.match(/\d+(?:\s*[x×]\s*\d+)+(?:\s*cm\b)?|\S+/gi) || [t];
          if (fichas.length === 1) return ["", t];
          if (fichas.length === 2) return [fichas[0], fichas[1]];
          var mejor = 1, puntaje = 99;
          for (var k = 1; k < fichas.length; k++) {
            var b = fichas.slice(k).join(" ");
            var p = Math.abs(b.length / t.length - 0.45);
            if (COLGANTES.indexOf(fichas[k - 1].toLowerCase().replace(/[¿?¡!,.]/g, "")) >= 0) p += 0.2;
            if (p < puntaje) { puntaje = p; mejor = k; }
          }
          return [fichas.slice(0, mejor).join(" "), fichas.slice(mejor).join(" ")];
        }
        function duo(prefijo, valor) {
          var partes = partir(valor);
          texto(prefijo + "-a", partes[0]);
          texto(prefijo + "-b", partes[1]);
          $(prefijo + "-a").style.display = partes[0] ? "block" : "none";
        }

        var hayPrecio = lleno(V.precio);
        var whatsapp = lleno(V.whatsapp) ? String(V.whatsapp).trim() : "";
        var beneficios = String(V.beneficios || "").split("|").map(function (s) { return s.trim(); }).filter(Boolean).slice(0, 3);
        var usarLogo = V.usar_logo === true || V.usar_logo === "true";

        duo("e1", V.p1);
        duo("e2", V.p2_titulo);
        duo("e3", V.p3_titulo);
        ["e1-marca", "e2-marca", "e3-marca"].forEach(function (id) { texto(id, V.marca); });
        texto("e1-etiqueta-txt", V.etiqueta);
        $("e1-etiqueta").style.display = lleno(V.etiqueta) ? "block" : "none";
        texto("e2-x1", V.p2_punto_1);
        texto("e2-x2", V.p2_punto_2);
        texto("e2-x3", V.p2_punto_3);
        texto("e3-sub", V.p3_sub);
        texto("e3-web", V.web);

        // Beneficios fijos del cierre (con tilde negro)
        var listaBenef = $("e3-benef");
        beneficios.forEach(function (b, i) {
          var li = document.createElement("li");
          li.className = "benef";
          li.id = "e3-bf" + (i + 1);
          li.innerHTML = '<span class="benef-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg></span><span class="benef-txt"></span>';
          texto(li.querySelector(".benef-txt"), b);
          listaBenef.appendChild(li);
        });

        // Achica la letra hasta que el texto entre en el ancho y alto disponibles.
        function ajustar(el, maxAncho, maxAlto, grande, chica, paso) {
          var t = grande;
          el.style.fontSize = t + "px";
          while ((el.scrollHeight > maxAlto || el.scrollWidth > maxAncho) && t > chica) {
            t -= paso || 2;
            el.style.fontSize = t + "px";
          }
          return t;
        }

        // Ubica una tarjeta de foto centrada: el ancho sigue la proporción de la foto.
        function tarjeta(id, arriba, alto, proporcion, maxAncho) {
          var pad = 22;
          var a = Number(proporcion) > 0 ? Number(proporcion) : 1;
          var ancho = Math.round(Math.min(maxAncho || 900, Math.max(Math.min(520, maxAncho || 900), (alto - 2 * pad) * a + 2 * pad)));
          var el = $(id);
          el.style.top = arriba + "px";
          el.style.height = alto + "px";
          el.style.width = ancho + "px";
          el.style.left = Math.round((1080 - ancho) / 2) + "px";
          return { izq: Math.round((1080 - ancho) / 2), arriba: arriba, ancho: ancho, alto: alto };
        }

        function centrar(el) {
          el.style.left = Math.round((1080 - el.offsetWidth) / 2) + "px";
        }

        function pesos(n) {
          return "$" + String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }

        function armar() {
          // ---------- Pantalla 1 ----------
          var t1 = $("e1-titulo");
          t1.style.top = "300px";
          ajustar(t1, 960, 440, 156, 72, 4);
          var fin1 = 300 + t1.offsetHeight;
          var et = $("e1-etiqueta");
          var finEt = fin1;
          if (et.style.display !== "none") {
            ajustar($("e1-etiqueta-txt"), 900, 54, 28, 20);
            et.style.top = fin1 + 34 + "px";
            centrar(et);
            finEt = fin1 + 34 + 62;
          }
          var arriba1 = Math.max(finEt + 70, 700);
          tarjeta("e1-flota", arriba1, Math.max(1300 - arriba1, 420), V.foto_1_ar, 860);

          // ---------- Pantalla 2 ----------
          var t2 = $("e2-titulo");
          t2.style.top = "300px";
          ajustar(t2, 960, hayPrecio ? 230 : 290, hayPrecio ? 108 : 124, 56, 4);
          var cursor = 300 + t2.offsetHeight;
          if (hayPrecio) {
            var bloque = $("e2-precio");
            bloque.style.display = "block";
            texto("e2-precio-num", V.precio);
            ajustar($("e2-precio-num"), 960, 240, 220, 110, 4);
            texto("e2-precio-unidad", V.precio_unidad);
            $("e2-precio-unidad").style.display = lleno(V.precio_unidad) ? "inline-block" : "none";
            texto("e2-precio-mes", V.precio_mes);
            $("e2-precio-mes").style.display = lleno(V.precio_mes) ? "block" : "none";
            bloque.style.top = cursor + 30 + "px";
            cursor += 30 + bloque.offsetHeight;
          }
          // Con el precio en grande, se saca cualquier punto que repita un precio.
          var puntos = [1, 2, 3].filter(function (i) {
            var v = V["p2_punto_" + i];
            var vacio = !lleno(v) || (hayPrecio && /\$\s?\d/.test(String(v)));
            $("e2-p" + i).style.display = vacio ? "none" : "flex";
            return !vacio;
          });
          puntos.forEach(function (i) { ajustar($("e2-x" + i), 840, 70, hayPrecio ? 42 : 46, 30); });
          var lista = $("e2-lista");
          lista.style.top = cursor + (hayPrecio ? 36 : 44) + "px";
          centrar(lista);
          cursor += (hayPrecio ? 36 : 44) + puntos.length * 76;
          var arriba2 = cursor + 64;
          var conFoto2 = 1300 - arriba2 >= 300;
          $("e2-flota").style.display = conFoto2 ? "block" : "none";
          $("e2-insignia").style.display = conFoto2 ? "flex" : "none";
          var br = $("e2-brillo");
          br.style.left = Math.round((1080 - 980) / 2) + "px";
          if (conFoto2) {
            var c2 = tarjeta("e2-flota", arriba2, 1300 - arriba2, V.foto_2_ar, 820);
            var ins = $("e2-insignia");
            ins.style.left = Math.min(c2.izq + c2.ancho - 100, 1080 - 176) + "px";
            ins.style.top = c2.arriba - 56 + "px";
            br.style.top = c2.arriba + c2.alto - 230 + "px";
          } else {
            br.style.top = parseInt($("e2-precio").style.top || "520", 10) - 40 + "px";
          }

          // ---------- Pantalla 3 (de abajo hacia arriba) ----------
          var abajo = 1300;
          var boton = $("e3-boton");
          if (whatsapp) {
            boton.style.display = "none";
            var waWeb = $("e3-wa-web");
            waWeb.style.display = "block";
            texto(waWeb, "WhatsApp · " + (V.web || ""));
            ajustar(waWeb, 960, 50, 38, 26);
            waWeb.style.top = abajo - waWeb.offsetHeight + "px";
            abajo -= waWeb.offsetHeight + 24;
            var wa = $("e3-wa");
            wa.style.display = "flex";
            texto("e3-wa-num", whatsapp);
            ajustar($("e3-wa-num"), 760, 116, 56, 34);
            wa.style.top = abajo - 116 + "px";
            centrar(wa);
            abajo -= 116;
          } else {
            ajustar($("e3-web"), 760, 116, 50, 32);
            boton.style.top = abajo - 116 + "px";
            centrar(boton);
            abajo -= 116;
          }
          var sub = $("e3-sub");
          ajustar(sub, 960, 56, 44, 28);
          var arribaSub = abajo - 40 - sub.offsetHeight;
          sub.style.top = arribaSub + "px";
          var t3 = $("e3-titulo");
          ajustar(t3, 960, beneficios.length ? 270 : 320, beneficios.length ? 136 : 150, 72, 4);
          var arribaT3 = arribaSub - 34 - t3.offsetHeight;
          t3.style.top = arribaT3 + "px";
          var arribaFoto3 = 300;
          if (beneficios.length) {
            listaBenef.style.top = "300px";
            centrar(listaBenef);
            arribaFoto3 = 300 + beneficios.length * 66 + 44;
          }
          var limite = arribaT3 - 50;
          var logo = $("e3-logo");
          if (usarLogo) {
            logo.style.display = "block";
            logo.style.top = limite - 90 + "px";
            centrar(logo);
            limite -= 120;
          }
          var conFoto3 = limite - arribaFoto3 >= 230;
          $("e3-flota").style.display = conFoto3 ? "block" : "none";
          if (conFoto3) {
            tarjeta("e3-flota", arribaFoto3, limite - arribaFoto3, V.foto_3_ar, 760);
          } else {
            // Sin lugar para la foto: todo arriba, uno debajo del otro (como el video original)
            var y = beneficios.length ? arribaFoto3 + 16 : 330;
            if (usarLogo) {
              logo.style.top = y + "px";
              y += 120;
            }
            t3.style.top = y + "px";
            y += t3.offsetHeight + 34;
            sub.style.top = y + "px";
            y += sub.offsetHeight + 40;
            if (whatsapp) {
              $("e3-wa").style.top = y + "px";
              $("e3-wa-web").style.top = y + 116 + 24 + "px";
            } else {
              boton.style.top = y + "px";
            }
          }

          // Las cajas van inclinadas (después de medir, para no alterar las medidas)
          gsap.set(["#e1-b", "#e3-b"], { rotation: -3 });
          gsap.set("#e2-b", { rotation: -2 });
          gsap.set("#e2-precio-unidad", { rotation: -2 });

          // ---------- Línea de tiempo ----------
          var tl = gsap.timeline({ paused: true });

          // Rayas del fondo con movimiento suave
          tl.fromTo("#e1-rayas", { x: 0 }, { x: 120, duration: 5, ease: "none" }, 0);
          tl.fromTo("#e3-rayas", { x: 0 }, { x: 120, duration: 5, ease: "none" }, 10);

          // Pantalla 1: todo visible desde el cuadro 0
          tl.fromTo("#e1-flota", { y: -50, rotation: -8 }, { y: 0, rotation: -3, duration: 0.6, ease: "back.out(1.6)" }, 0);
          tl.fromTo("#e1-b", { scale: 0.86 }, { scale: 1, duration: 0.45, ease: "back.out(2.4)" }, 0.12);
          tl.fromTo("#e1-etiqueta", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.45);
          tl.to("#e1-flota", { y: -14, duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 0.6);
          tl.fromTo("#e1-foto", { scale: 1 }, { scale: 1.07, duration: 3.8, ease: "none" }, 0.7);
          tl.to("#e1-b", { scale: 1.07, duration: 0.16, ease: "power1.inOut", yoyo: true, repeat: 1 }, 2.6);

          // Barrido 1: el amarillo tapa la pantalla 1 y destapa la 2 en diagonal
          tl.set("#c1-banda", { skewX: -14, x: -2400 }, 4.5);
          tl.to("#c1-banda", { x: -460, duration: 0.5, ease: "power2.in" }, 4.5);
          tl.to("#c1-banda", { x: 1450, duration: 0.5, ease: "power2.out" }, 5.0);

          // Pantalla 2
          tl.fromTo("#e2-a", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 5.2);
          tl.fromTo("#e2-b", { scale: 0.55, rotation: -9, opacity: 0 }, { scale: 1, rotation: -2, opacity: 1, duration: 0.5, ease: "back.out(2)" }, 5.35);
          tl.fromTo("#e2-brillo", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.8, ease: "power2.out" }, 5.4);
          var arranquePuntos = 6.35;
          if (hayPrecio) {
            // El precio sube contando hasta el valor final
            var final = Number(V.precio_valor) > 0 ? Number(V.precio_valor) : 0;
            var num = $("e2-precio-num");
            tl.fromTo("#e2-precio-num", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2)" }, 5.6);
            if (final > 0) {
              var cuenta = { v: final * 0.94 };
              tl.fromTo(cuenta, { v: final * 0.94 }, {
                v: final, duration: 0.9, ease: "power2.out",
                onUpdate: function () { num.textContent = this.progress() >= 1 ? String(V.precio) : pesos(cuenta.v); },
              }, 5.6);
            }
            tl.fromTo("#e2-precio-unidad", { scale: 0.5, rotation: -8, opacity: 0 }, { scale: 1, rotation: -2, opacity: 1, duration: 0.45, ease: "back.out(2.2)" }, 6.45);
            tl.fromTo("#e2-precio-mes", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 6.75);
            arranquePuntos = 7.0;
          }
          if (conFoto2) {
            tl.fromTo("#e2-flota", { y: 140, rotation: 6, opacity: 0 }, { y: 0, rotation: 2, opacity: 1, duration: 0.6, ease: "back.out(1.4)" }, 5.25);
            tl.fromTo("#e2-foto", { scale: 1 }, { scale: 1.08, duration: 4.2, ease: "none" }, 5.6);
            tl.fromTo("#e2-insignia", { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.6)" }, 6.05);
            tl.to("#e2-insignia", { scale: 1.1, duration: 0.18, ease: "power1.inOut", yoyo: true, repeat: 1 }, 8.6);
          }
          puntos.forEach(function (i, n) {
            var t = arranquePuntos + n * 0.55;
            tl.fromTo("#e2-t" + i, { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2.4)" }, t);
            tl.fromTo("#e2-x" + i, { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, t + 0.05);
          });

          // Barrido 2: el negro tapa la pantalla 2 y destapa la 3 en diagonal
          tl.set("#c2-banda", { skewX: -14, x: -2400 }, 9.5);
          tl.to("#c2-banda", { x: -460, duration: 0.5, ease: "power2.in" }, 9.5);
          tl.to("#c2-banda", { x: 1450, duration: 0.5, ease: "power2.out" }, 10.0);

          // Pantalla 3
          beneficios.forEach(function (b, n) {
            tl.fromTo("#e3-bf" + (n + 1), { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "back.out(1.8)" }, 10.2 + n * 0.18);
          });
          if (conFoto3) {
            tl.fromTo("#e3-flota", { y: -80, rotation: -9, opacity: 0 }, { y: 0, rotation: -3, opacity: 1, duration: 0.6, ease: "back.out(1.5)" }, 10.2);
            tl.fromTo("#e3-foto", { scale: 1 }, { scale: 1.06, duration: 4.2, ease: "none" }, 10.5);
          }
          tl.fromTo("#e3-a", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 10.35);
          tl.fromTo("#e3-b", { scale: 0.55, rotation: -10, opacity: 0 }, { scale: 1, rotation: -3, opacity: 1, duration: 0.5, ease: "back.out(2)" }, 10.5);
          if (usarLogo) tl.fromTo("#e3-logo", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 10.4);
          tl.fromTo("#e3-sub", { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 10.9);
          var cta = whatsapp ? "#e3-wa" : "#e3-boton";
          tl.fromTo(cta, { y: 40, scale: 0.6, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2)" }, 11.2);
          tl.to(cta, { scale: 1.07, duration: 0.18, ease: "power1.inOut", yoyo: true, repeat: 1 }, 12.4);
          tl.to(cta, { scale: 1.07, duration: 0.18, ease: "power1.inOut", yoyo: true, repeat: 1 }, 13.5);
          if (whatsapp) {
            tl.fromTo("#e3-wa-web", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 11.5);
          } else {
            tl.fromTo("#e3-flecha", { x: 0 }, { x: 12, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 5 }, 11.9);
          }

          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
        }

        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(armar);
        } else {
          armar();
        }
      })();
    </script>
  </body>
</html>
