# n8n para el sistema de videos: versión comunitaria, en esta PC, solo accesible desde esta PC.
#   Levantar: docker compose up -d
#   Parar:    docker compose stop   (o "docker compose down", SIN -v: -v borra el flujo, las credenciales y el historial)
#
# Antes de levantarlo por primera vez, revisá dos cosas:
#  1. TZ y GENERIC_TIMEZONE: la zona horaria del negocio (la misma de config/negocio.json).
#  2. La subred 172.31.250.0/24 tiene que estar libre (docker network ls / docker network inspect <red>).
#     Si está ocupada, cambiala acá y en el .env. El motor escucha en el gateway de esta red:
#       MOTOR_HOST=172.31.250.1   y   MOTOR_URL_PARA_N8N=http://172.31.250.1:8099
#     Si la PC tiene firewall (ufw), puede hacer falta dejar pasar a n8n:
#       sudo ufw allow in on br-videos-redes to 172.31.250.1 port 8099 proto tcp
name: videos-redes

services:
  n8n:
    # Versión probada con el flujo del sistema. Para actualizar, cambiala acá, hacé un respaldo y: docker compose pull && docker compose up -d
    image: docker.n8n.io/n8nio/n8n:2.31.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - GENERIC_TIMEZONE=America/Argentina/Buenos_Aires
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      # Solo se entra desde esta PC (http://127.0.0.1:5678), sin https.
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_datos:/home/node/.n8n
    networks:
      - red

volumes:
  n8n_datos:

networks:
  red:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-videos-redes
    ipam:
      config:
        - subnet: 172.31.250.0/24
          gateway: 172.31.250.1
